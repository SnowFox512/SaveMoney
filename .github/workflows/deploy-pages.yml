name: Deploy savings planner
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: github-upload
        run: pnpm install --frozen-lockfile
      - name: Test and build
        working-directory: github-upload
        run: |
          pnpm test
          pnpm exec tsc -b
          pnpm exec vite build --configLoader runner --base /SaveMoney/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: github-upload/dist
      - id: deployment
        uses: actions/deploy-pages@v4
